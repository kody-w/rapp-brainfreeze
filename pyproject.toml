[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brainfreeze"
version = "0.1.0"
description = "Freeze a running RAPP brainstem and resume it anywhere; disposable brainstems for testing."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
brainfreeze = "brainfreeze.__main__:main"
